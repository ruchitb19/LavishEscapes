version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lavishescapes-backend
    ports:
      - "5500:5500"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lavishescapes-frontend
    ports:
      - "8500:80"
    depends_on:
      - backend
    restart: unless-stopped
